<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List App</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 150px;background: conic-gradient(#667eea, #764ba2);  }
    input { padding: 10px; width: 250px; font-size: 16px; }
    button { padding: 10px 20px; margin-left: 5px; font-size: 16px; }
    ul { list-style: none; padding: 0; width: 300px; margin: 30px auto; }
    li {
      background: #fff; margin: 6px 0; padding: 10px;
      display: flex; justify-content: space-between; align-items: center;
      border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .delete { color: red; cursor: pointer; }
  </style>
</head>
<body>
  <h2>📝 To-Do List</h2>
  <input type="text" id="taskInput" placeholder="Enter a new task">
  <button id="addBtn">Add</button>

  <ul id="taskList"></ul>

  <script>
    const input = document.getElementById("taskInput");
    const addBtn = document.getElementById("addBtn");
    const list = document.getElementById("taskList");
    let tasks = [];

    // Add task
    addBtn.addEventListener("click", () => {
      const task = input.value.trim();
      if (task === "") return alert("Please enter a task!");
      tasks.push(task);
      input.value = "";
      displayTasks();
    });

    // Display tasks
    function displayTasks() {
      list.innerHTML = "";
      tasks.forEach((task, index) => {
        const li = document.createElement("li");
        li.innerHTML = `${task} <span class='delete' onclick='deleteTask(${index})'>❌</span>`;
        list.appendChild(li);
      });
    }

    // Delete task
    function deleteTask(index) {
      tasks.splice(index, 1);
      displayTasks();
    }
  </script>
</body>
</html>
