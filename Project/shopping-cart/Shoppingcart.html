<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 40px; background: linear-gradient(#667eea, #764ba2); }
    input, button { padding: 10px; margin: 5px; font-size: 16px; }
    table { width: 400px; margin: 30px auto; border-collapse: collapse; }
    th, td { padding: 10px; border: 1px solid #ccc; text-align: center; }
    th { background: #eee; }
    .remove { color: red; cursor: pointer; }
  </style>
</head>
<body>
  <h2>🛒 Simple Shopping Cart</h2>
  <input type="text" id="itemName" placeholder="Item name">
  <input type="number" id="itemPrice" placeholder="Price (₹)">
  <button onclick="addItem()">Add Item</button>

  <table id="cartTable">
    <thead>
      <tr>
        <th>#</th>
        <th>Item</th>
        <th>Price (₹)</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="cartBody"></tbody>
    <tfoot>
      <tr>
        <td colspan="2"><b>Total:</b></td>
        <td id="total">0</td>
        <td></td>
      </tr>
    </tfoot>
  </table>

  <script>
    let cart = [];

    function addItem() {
      let name = document.getElementById("itemName").value.trim();
      let price = Number(document.getElementById("itemPrice").value);
      if (name === "" || price <= 0) {
        alert("⚠️ Please enter valid item name and price!");
        return;
      }
      cart.push({ name: name, price: price });
      document.getElementById("itemName").value = "";
      document.getElementById("itemPrice").value = "";
      displayCart();
    }

    function removeItem(index) {
      cart.splice(index, 1);
      displayCart();
    }

    function displayCart() {
      const cartBody = document.getElementById("cartBody");
      cartBody.innerHTML = "";
      let total = 0;

      cart.forEach((item, i) => {
        total += item.price;
        cartBody.innerHTML += `
          <tr>
            <td>${i + 1}</td>
            <td>${item.name}</td>
            <td>${item.price}</td>
            <td><span class='remove' onclick='removeItem(${i})'>❌</span></td>
          </tr>
        `;
      });

      document.getElementById("total").textContent = total;
    }
  </script>
</body>
</html>
