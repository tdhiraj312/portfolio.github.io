<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Counter</title>
  <link rel="stylesheet" href="../common/theme.css">
  <style>
    body { font-family: Arial; text-align: center; margin-top: 40px; background: linear-gradient(#667eea, #764ba2); 
    margin-top:80px;
    padding:0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    }
    textarea { width: 300px; height: 120px; padding: 10px; font-size: 16px; }
    p { font-size: 18px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="game-box">
  <h2>🧮 Character Counter</h2>
  <textarea id="textBox" placeholder="Type something..."></textarea>
  <p id="count">Characters: 0 / 1000</p>

  

  <script>
    const textBox = document.getElementById("textBox");
    const count = document.getElementById("count");
    const maxLimit = 1000;

    textBox.addEventListener("input", () => {
      let currentLength = textBox.value.length;
      count.textContent = `Characters: ${currentLength} / ${maxLimit}`;

      // Change color when near limit
      if (currentLength > maxLimit) {
        count.style.color = "red";
      } else if (currentLength > maxLimit - 20) {
        count.style.color = "orange";
      } else {
        count.style.color = "white";
      }
    });
  </script>
</body>
</html>
