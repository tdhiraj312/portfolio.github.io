<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Checker</title>
   <link rel="stylesheet" href="../common/theme.css">
  <style>
    body { font-family: Arial; text-align: center; margin-top:80px;
    padding:0;
    width: 100%;
    height: 100%;
    overflow: hidden; }
    input { padding: 10px; font-size: 18px; width: 250px; }
    #strength { margin-top: 15px; font-size: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="game-box">
  <h2>🔐 Password Strength Checker</h2>
  <input type="password" id="password" placeholder="Enter password" />
  <p id="strength"></p>

  <script>
    const passwordInput = document.getElementById("password");
    const strengthDisplay = document.getElementById("strength");

    passwordInput.addEventListener("input", function() {
      const pwd = passwordInput.value;
      let strength = "";

      if (pwd.length === 0) {
        strength = "";
      } else if (pwd.length < 5) {
        strength = "❌ Weak";
        strengthDisplay.style.color = "red";
      } else if (pwd.length < 8) {
        strength = "⚠️ Medium";
        strengthDisplay.style.color = "orange";
      } else if (/[A-Z]/.test(pwd) && /[0-9]/.test(pwd) && /[^A-Za-z0-9]/.test(pwd)) {
        strength = "✅ Strong";
        strengthDisplay.style.color = "green";
      } else {
        strength = "⚠️ Medium (add symbols, numbers & uppercase)";
        strengthDisplay.style.color = "orange";
      }

      strengthDisplay.textContent = "Strength: " + strength;
    });
  </script>
</body>
</html>
