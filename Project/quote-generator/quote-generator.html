<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Quote Generator</title>
  
  <style>
    body { 
      font-family: Arial; 
      text-align: center; 
      margin-top: 60px; 
     background: linear-gradient(#667eea, #764ba2);
    }
    #quoteBox {
      background: white;
      padding: 30px;
      width: 400px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
    }
    h3 {
      color: #333;
    }
    p {
      font-size: 18px;
      color: #555;
    }
  </style>
</head>
<body>
  <h2>💬 Random Quote Generator</h2>
  <div id="quoteBox">
    <h3 id="quote">Click below to get a quote!</h3>
    <p id="author"></p>
  </div>
  <button onclick="generateQuote()">New Quote</button>

  <script>
    const quotes = [
      { quote: "The best way to get started is to quit talking and begin doing.", author: "Walt Disney" },
      { quote: "Don't let yesterday take up too much of today.", author: "Will Rogers" },
      { quote: "It's not whether you get knocked down, it's whether you get up.", author: "Vince Lombardi" },
      { quote: "If you are working on something exciting, it will keep you motivated.", author: "Steve Jobs" },
      { quote: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill" }
    ];

    function generateQuote() {
      const randomIndex = Math.floor(Math.random() * quotes.length);
      const selectedQuote = quotes[randomIndex];
      document.getElementById("quote").textContent = `"${selectedQuote.quote}"`;
      document.getElementById("author").textContent = "- " + selectedQuote.author;
    }
  </script>
</body>
</html>
